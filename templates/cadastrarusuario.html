<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Novo Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="static/styleusuario.css">
</head>
<body> 
 
    <img id="fundohomesenai" src="static/fundohomesenai.jpg">

    <div class="container mt-3">
        <img id='logo_senai' src='static/logo_senai.png' alt="Logo SENAI">
    </div>

   <nav id="caixanavbar" class="navbar navbar-expand-lg bg-body-tertiary mt-3">
      <div class="container">
        <a class="navbar-brand" href="/home?">Voltar</a>
      </div>
    </nav>

    <div id="caixatabela" class="container mt-4">

      <h2 id="titulotabela" class="mb-5 text-secondary">Novo Cadastro de Usuário</h2>
 
      <div class="bg-white rounded shadow-sm p-5">
        <form action="/salvarusuario" method="POST">
          <div class="mb-4">
              <label class="form-label fw-bold text-muted">Nome do Usuário</label>
              <input type="text" name="usuario" class="form-control" placeholder="Digite o nome de usuário" required>
          </div>

          <div class="mb-4">
              <label class="form-label fw-bold text-muted">Senha</label>
              <input type="password" name="senha" class="form-control" placeholder="********" required>
          </div>
      
          <div class="mb-4">
              <label class="form-label fw-bold text-muted">Papel </label>
              <select name="papel" class="form-select" required>
                  <option value="" disabled selected>Selecione um papel</option>
                  <option value="admin">Administrador</option>
                  <option value="usuario">Usuário</option>
              </select>
          </div>
      
          <div class="d-flex justify-content-end mt-4">
              <a href="/home" class="btn btn-outline-secondary me-2">Cancelar</a>
              <button type="submit" class="btn btn-primary" style="background-color: rgb(8, 69, 201); border: none; padding: 10px 30px;">Cadastrar Usuário</button>
          </div>
        </form>
      </div>
 
    </div>

</body>
</html>
