<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimentação de Itens - Almoxarifado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="static/stylemovimentacoes.css">
</head>
<body> 
  
    <img id="fundohomesenai" src="static/fundohomesenai.jpg" alt="Fundo">

    <div class="container mt-3">
        <img id='logo_senai' src='static/logo_senai.png' alt="Logo SENAI">
    </div>

    <nav id="caixanavbar" class="navbar navbar-expand-lg bg-body-tertiary mt-3 container">
      <div class="container-fluid">
        <a class="navbar-brand" href="/home">Voltar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0"></ul>
        </div>
      </div>
    </nav>

    <div id="caixatabela" class="container mt-4">

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <h2 id="titulotabela" class="m-0">Estoque</h2>
        </div>
    
        <div class="table-responsive bg-white rounded shadow-sm">
            <table class="table table-hover align-middle mb-0 text-center" id="tabelaMovimentacoes"> 
                <thead class="table-light border-bottom">
                    <tr>
                        <th scope="col" class="py-3">ID Reg.</th>
                        <th scope="col" class="py-3">Produto</th>
                        <th scope="col" class="py-3">Quantidade</th>
                        <th scope="col" class="py-3 text-start">Descrição</th>
                    </tr>
                </thead>
                <tbody>
                  {% for movimento in resultado %}
                    <tr>
                        <td class="fw-bold text-muted">{{ movimento[0] }}</td>
                        <td>{{ movimento[1] }}</td>
                        <td class="fw-bold">{{ movimento[4] }} un</td>
                        <td class="text-muted text-wrap text-start" style="max-width: 300px;">{{ movimento[3] }}</td>
                    </tr>
                  {% endfor %}
                </tbody>
            </table>
        </div>
    
    </div>
    
    <div id="caixatabela" class="container mt-4 mb-5">

      <h2 id="titulotabela" class="mb-5">Lançar Nova Movimentação</h2>
  
      <div class="bg-white rounded shadow-sm p-5">
        <form action="/registrarmovimentacao" method="POST">
          <div class="row">

              <div class="col-md-6 mb-4">
                  <label class="form-label fw-bold text-muted">Nome do Produto</label>
                  <input type="text" name="produto" class="form-control" placeholder=" Digite o nome" list="produtos_list" required>
              </div>

              <div class="row">
              <div class="col-md-6 mb-4">
                  <label class="form-label fw-bold text-muted">Tipo de Movimentação</label>
                  <select name="tipo_movimentacao" class="form-select" required>
                      <option value="Entrada">Entrada </option>
                      <option value="Saida">Saída </option>
                  </select>
                </div>
              </div>
          </div>
      
          <div class="row">
              <div class="col-md-6 mb-4">
                  <label class="form-label fw-bold text-muted">Quantidade</label>
                  <input type="number" name="quantidade" class="form-control" min="1" placeholder="0" required>
              </div>
          
              
          <div class="d-flex justify-content-end mt-4">
              <a href="/home" class="btn btn-outline-secondary me-2">Cancelar</a>
              <button type="submit" class="btn btn-primary" style="background-color: rgb(8, 69, 201); border: none; padding: 10px 30px;">Salvar Movimentação</button>
          </div>
      </form>
      </div>
  
    </div>

</body>
</html>
